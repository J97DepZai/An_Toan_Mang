events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------------------------------------
    # KHỐI 1: Frontend React (Nhận cả HTTP và HTTPS)
    # -------------------------------------------------------------
    server {
        listen 80;
        listen 443 ssl;
        server_name dinhquoc.duckdns.org web.dinhquoc.duckdns.org;

        ssl_certificate     /etc/nginx/certs/dinhquoc.crt;
        ssl_certificate_key /etc/nginx/certs/dinhquoc.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Hỗ trợ gọi trực tiếp /api/ nếu frontend dùng relative path
        location /api/ {
            proxy_pass http://quoc2_backend-container:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Giao diện Frontend React
        location / {
            proxy_pass http://quoc2_frontend-container:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ kết nối Real-time WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------------------------------------------
    # KHỐI 2: Backend API Spring Boot (Nhận cả HTTP và HTTPS)
    # -------------------------------------------------------------
    server {
        listen 80;
        listen 443 ssl;
        server_name api.dinhquoc.duckdns.org;

        ssl_certificate     /etc/nginx/certs/dinhquoc.crt;
        ssl_certificate_key /etc/nginx/certs/dinhquoc.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://quoc2_backend-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}