events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------------------------------------
    # 1. HTTP (Port 80) -> Tự động chuyển hướng toàn bộ sang HTTPS (443)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name web.dinhquoc.name.vn dinhquoc.name.vn api.dinhquoc.name.vn;

        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------
    # 2. HTTPS (Port 443): SSL cho Frontend React
    # -------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name web.dinhquoc.name.vn dinhquoc.name.vn;

        ssl_certificate     /etc/nginx/certs/dinhquoc.crt;
        ssl_certificate_key /etc/nginx/certs/dinhquoc.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://quoc2_frontend-container:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Hỗ trợ kết nối Real-time WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------------------------------------------
    # 3. HTTPS (Port 443): SSL cho Backend API Spring Boot
    # -------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name api.dinhquoc.name.vn;

        ssl_certificate     /etc/nginx/certs/dinhquoc.crt;
        ssl_certificate_key /etc/nginx/certs/dinhquoc.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://quoc2_backend-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}