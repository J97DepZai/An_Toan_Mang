# 1. Chuyển hướng HTTP (Cổng 80) sang HTTPS (Cổng 443)
server {
    listen 80;
    server_name dinhquoc.duckdns.org web.dinhquoc.duckdns.org api.dinhquoc.duckdns.org;

    return 301 https://$host$request_uri;
}

# 2. Cổng chuẩn HTTPS 443 cho Frontend của Quốc (web.dinhquoc.duckdns.org & dinhquoc.duckdns.org)
server {
    listen 443 ssl;
    server_name dinhquoc.duckdns.org web.dinhquoc.duckdns.org;

    ssl_certificate     /root/jobportal2/nginx/certs/dinhquoc.crt;
    ssl_certificate_key /root/jobportal2/nginx/certs/dinhquoc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://127.0.0.1:8446;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Header đánh dấu nhận diện dự án của Quốc
        add_header X-Debug-Host "quoc-frontend-matched" always;

        # Hỗ trợ kết nối WebSocket React
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. Cổng chuẩn HTTPS 443 cho Backend API của Quốc (api.dinhquoc.duckdns.org)
server {
    listen 443 ssl;
    server_name api.dinhquoc.duckdns.org;

    ssl_certificate     /root/jobportal2/nginx/certs/dinhquoc.crt;
    ssl_certificate_key /root/jobportal2/nginx/certs/dinhquoc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://127.0.0.1:8446;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Header đánh dấu nhận diện dự án của Quốc
        add_header X-Debug-Host "quoc-backend-matched" always;
    }
}
