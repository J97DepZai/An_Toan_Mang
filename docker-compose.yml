version: '3.8'

services:
  # 1. Database MySQL
  jobportal2-db:
    container_name: quoc2_mysqldb
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jobportal_db
    ports:
      - "3307:3306"
    volumes:
      - db_data2:/var/lib/mysql
    networks:
      - jobportal2-network

  # 2. Backend Spring Boot (Chạy nội bộ)
  jobportal2-backend:
    build: ./jobportal
    container_name: quoc2_backend-container
    restart: always
    depends_on:
      - jobportal2-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://jobportal2-db:3306/jobportal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - jobportal2-network

  # 3. Frontend React (Chạy nội bộ)
  jobportal2-frontend:
    build: ./react-social
    container_name: quoc2_frontend-container
    restart: always
    depends_on:
      - jobportal2-backend
    environment:
      - REACT_APP_API_BASE_URL=https://api.dinhquoc.duckdns.org
    networks:
      - jobportal2-network

  # 4. Nginx Container (Hỗ trợ cả cổng chuẩn 80/443 và cổng phụ 8086/8446)
  jobportal2-nginx:
    container_name: quoc2_nginx-container
    image: nginx:latest
    ports:
      - "80:80"
      - "8086:80"
      - "443:443"
      - "8446:443"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - jobportal2-frontend
      - jobportal2-backend
    networks:
      - jobportal2-network

volumes:
  db_data2:

networks:
  jobportal2-network:
    driver: bridge